name: MCP release smoke

# `raxol mcp` as OMP runs it: the linux-amd64 release through the npm launcher,
# on the production authorizer path (a release ships no Mix). What keeps its
# stdout a clean JSON-RPC wire happens only in a release: the runtime.exs
# predicate on Burrito's arguments, stderr as group leader before any app
# starts, the `user` wire under `-noshell` with stdin written before boot, and
# unicode stdio from rel/vm.args.eex. The build is the release's own
# (burrito-build.yml); this publishes nothing.

on:
  pull_request:
    paths:
      - 'packages/raxol_cli/**'
      # raxol_cli's path dependencies, built into the release from source.
      - 'packages/raxol_agent/**'
      - 'packages/raxol_agent_client_protocol/**'
      - 'packages/raxol_web3/**'
      - 'docker/Dockerfile.raxol-cli'
      # The toolchain pin the Docker build reads.
      - 'mise.toml'
      - '.github/workflows/mcp-smoke.yml'
      - '.github/workflows/burrito-build.yml'
  workflow_dispatch:

concurrency:
  group: mcp-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reads the release's cache and writes its own scope with `mode=min`, so a
  # pull request never seeds a release build and per-PR caches stay small.
  smoke:
    name: raxol mcp
    uses: ./.github/workflows/burrito-build.yml
    with:
      package: raxol_cli
      dockerfile: docker/Dockerfile.raxol-cli
      cache-scope: cli
      cache-write-scope: mcp-smoke
      cache-mode: min
      linux-arches: '["amd64"]'
      macos: false
      mcp-smoke: true
      upload: false
