name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  TMPDIR: /tmp
  MIX_AUDIT_VERSION: 2.1.5

jobs:
  package-tests:
    name: Package Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [raxol_agent, raxol_payments, raxol_broker, raxol_earn, raxol_web3, raxol_console, raxol_cli, raxol_agent_client_protocol]

    # Only the raxol_agent leg gets a Postgres, for its ThreadLog adapter tests;
    # an empty image skips the service on the other legs.
    services:
      postgres:
        image: ${{ matrix.package == 'raxol_agent' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raxol_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      # `_build` holds the compiled sibling packages, which no lockfile names,
      # so the key covers every mix.exs.
      - name: Cache package dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: pkg-${{ matrix.package }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}-${{ hashFiles('packages/*/mix.exs') }}

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Set up Node
        if: matrix.package == 'raxol_payments' || matrix.package == 'raxol_cli'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache pinned @xochi/spec
        if: matrix.package == 'raxol_payments'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xochi-spec-cache
          key: xochi-spec-${{ runner.os }}-${{ hashFiles('packages/raxol_payments/test/fixtures/XOCHI_SPEC_VERSION', 'packages/raxol_payments/test/fixtures/XOCHI_SPEC_INTEGRITY') }}

      - name: Fetch and verify pinned @xochi/spec
        if: matrix.package == 'raxol_payments'
        run: |
          package_root="$(
            scripts/fetch_xochi_spec.sh \
              "$RUNNER_TEMP/xochi-spec-cache" \
              "$RUNNER_TEMP/xochi-spec/package"
          )"
          echo "XOCHI_SPEC_DIR=$package_root" >> "$GITHUB_ENV"

      # No package's .formatter.exs imports deps, so this needs nothing fetched
      # and fails a misformatted change before the compile is paid for.
      - name: Check formatting
        working-directory: packages/${{ matrix.package }}
        run: mix format --check-formatted

      # The shadow guard runs first: a Hex entry for a path sibling unpins that
      # entry's whole subtree, and `mix deps.get` does not remove it.
      - name: Fetch dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          mix run --no-start --no-compile --no-deps-check ../../scripts/check_lock_path_shadows.exs
          mix deps.get --check-locked

      # Retired releases and advisories, from Hex (`hex.audit`, which since
      # Hex 2.7 reports advisories too) and from mix_audit (a pinned escript,
      # so no package carries it as a dep). Here they only warn, so a newly
      # published advisory does not fail every open PR; the nightly fails on
      # them.
      - name: Audit dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          mix escript.install hex mix_audit "$MIX_AUDIT_VERSION" --force
          warn() {
            echo "::warning title=Dependency audit (${{ matrix.package }})::$1 found retired or vulnerable deps; see this step's log. The nightly fails on them."
          }
          mix hex.audit || warn "mix hex.audit"
          "$HOME/.mix/escripts/mix_audit" || warn mix_audit

      - name: Compile package
        working-directory: packages/${{ matrix.package }}
        run: mix compile --warnings-as-errors

      # The packages listed here are credo-clean; the rest carry findings that
      # predate this gate and join the list as they are cleared.
      - name: Credo
        if: contains(fromJSON('["raxol_agent_client_protocol", "raxol_broker", "raxol_cli", "raxol_console", "raxol_web3"]'), matrix.package)
        working-directory: packages/${{ matrix.package }}
        run: mix credo

      # Stated here, not left to each test_helper: raxol_payments computes its
      # exclusions from which environment variables are present. A parent tag
      # covers the tests tagged inside its module (`live_xochi` covers
      # `live_xochi_matrix`/`live_xochi_preflight`, `live_xochi_order` covers
      # `live_xochi_order_settle`).
      - name: Run package tests
        working-directory: packages/${{ matrix.package }}
        run: |
          mix test \
            --exclude live_xochi \
            --exclude live_xochi_order \
            --exclude live_xochi_order_preflight \
            --exclude live_relay \
            --exclude live_property \
            --exclude live_parity \
            --exclude live_solver_fee \
            --exclude live_chain \
            --exclude live_bundler \
            --exclude live_acp_dev \
            --exclude cli_signer

      # `bin/raxol-acp --agent` as an OS process. Included by file, as is the
      # Postgres suite below: each `:integration` suite needs its own setup.
      - name: Run ACP stdio loopback
        if: matrix.package == 'raxol_agent'
        working-directory: packages/raxol_agent
        run: mix test --include integration test/raxol/agent/acp_loopback_test.exs

      # The Postgrex ThreadLog adapter against the service container above.
      - name: Run Postgres ThreadLog adapter tests
        if: matrix.package == 'raxol_agent'
        working-directory: packages/raxol_agent
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: raxol_agent_test
        run: mix test --include integration test/raxol/agent/thread_log/postgrex_test.exs

      # `raxol mcp` as an OS process.
      - name: Run raxol mcp subprocess tests
        if: matrix.package == 'raxol_cli'
        working-directory: packages/raxol_cli
        run: mix test --include integration test/raxol/cli/mcp_integration_test.exs
