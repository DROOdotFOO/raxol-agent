name: Release raxol_console npm package

# Builds the self-contained Console runtime binaries and assembles the
# `raxol-console` npm package, so the Virtuals Console's acp-cli installs and runs
# Raxol like a Node runtime. burrito-build.yml builds and smokes each native
# binary (Linux amd64/arm64, macOS arm64).
#
# The npm tarball is always produced as an artifact. Publishing needs a
# `raxol-console-v*` tag matching npm/package.json, or a manual run with
# `publish: true`; either way the commit needs green CI, and the publish waits
# for release-environment approval. npm CLI 11.5.1+ uses the package's
# configured trusted publisher and emits provenance, so no token is stored.

on:
  push:
    tags:
      - 'raxol-console-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (off = build the tarball artifact only)'
        type: boolean
        default: false

concurrency:
  group: release-raxol-console-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.flags.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Publish only on a tag, or a manual run that opted in.
      - name: Resolve publish flag
        id: flags
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$PUBLISH_INPUT" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release preflight
        uses: ./.github/actions/release-preflight
        with:
          tag-prefix: raxol-console-v
          version-file: packages/raxol_console/npm/package.json
          require-green-ci: ${{ steps.flags.outputs.publish }}

  build:
    name: build
    needs: validate
    uses: ./.github/workflows/burrito-build.yml
    with:
      package: raxol_console
      dockerfile: docker/Dockerfile.raxol-console
      cache-scope: console

  package:
    name: assemble npm package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: raxol_console-*
          merge-multiple: true
          path: packages/raxol_console/burrito_out

      # Copies every binary into vendor/ with its exec bit (artifacts drop it)
      # and fails when none arrived.
      - name: Stage binaries
        run: packages/raxol_console/npm/scripts/pack.sh

      - name: Pack tarball
        working-directory: packages/raxol_console/npm
        run: |
          npm pack
          ls -lh vendor/ ./*.tgz

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: raxol-console-npm-tarball
          path: packages/raxol_console/npm/*.tgz
          if-no-files-found: error

  # A separate job so the build finishes before the protected release
  # environment asks for approval. It publishes the tarball `package` packed,
  # so what was smoked is what ships.
  publish:
    name: publish npm package
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download npm tarball
        uses: actions/download-artifact@v8
        with:
          name: raxol-console-npm-tarball
          path: dist

      # Resumable: a version already on the registry is skipped.
      - name: Publish to npm
        run: |
          set -euo pipefail
          name="$(node -p 'require("./packages/raxol_console/npm/package.json").name')"
          version="$(node -p 'require("./packages/raxol_console/npm/package.json").version')"
          tarball="dist/raxol-console-$version.tgz"
          [[ -f "$tarball" ]] || { echo "::error::$tarball was not packed"; exit 1; }

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
          else
            npm publish "$tarball" --provenance --access public
          fi

          for attempt in {1..180}; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              break
            fi
            (( attempt < 180 )) || {
              echo "::error::$name@$version was published but is not visible after 15 minutes"
              exit 1
            }
            echo "Waiting for $name@$version to become visible ($attempt/180)"
            sleep 5
          done

          predicate="$(npm view "$name@$version" dist.attestations.provenance.predicateType)"
          [[ "$predicate" == "https://slsa.dev/provenance/v1" ]] || {
            echo "::error::$name@$version has no SLSA provenance"
            exit 1
          }
