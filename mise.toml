# The reference toolchain. mise reads this file, and CI reads it as
# `version-file` with `version-type: strict`. Change the pin here only.

[tools]
erlang = "29.0.3"
elixir = "1.20.2-otp-29"
# Node runs the npm launchers, their smoke scripts and the xochi spec fetch.
# 24 is what npm trusted publishing needs (npm 11.5.1+); CI sets the same
# major in each `node-version`, since setup-node does not read this file.
node = "24"
